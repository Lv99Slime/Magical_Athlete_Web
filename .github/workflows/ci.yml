name: Verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_multiplayer:
        description: Run the real Supabase integration suite
        type: boolean
        default: true
  workflow_call:
    inputs:
      verify_multiplayer:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  multiplayer:
    if: github.event_name == 'pull_request' || inputs.verify_multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@v3
        id: supabase
        with:
          # Fixed npm release: avoid the unauthenticated GitHub latest-release lookup.
          version: 2.120.0
      - run: npm ci
      # This provisions a real local Auth/Postgres/Realtime/Edge stack with Docker.
      # The runner asserts both test variables, so a skipped network suite cannot pass this gate.
      - run: npm run test:backend:ci
      - name: Stop backend after failure or cancellation
        if: always() && steps.supabase.outcome == 'success'
        run: supabase stop --no-backup
